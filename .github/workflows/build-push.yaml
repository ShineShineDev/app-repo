name: Build & Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write


jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true      
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max



  update-manifest:
    name: Update Image Tag in Manifest Repo
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout manifest repo
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.MANIFEST_REPO }}       # e.g. your-org/manifest-repo
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifest-repo

      - name: Update image tag in deployment manifest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:sha-${SHORT_SHA}"

          # Update the image field inside the deployment container spec
          sed -i "s|image:.*|image: ${NEW_IMAGE}|" \
            manifest-repo/fluxcd/app-manifests/pos-api-deployment.yaml

          echo "Updated image to: ${NEW_IMAGE}"
          cat manifest-repo/fluxcd/app-manifests/pos-api-deployment.yaml

      - name: Commit and push updated manifest
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # Read the app-repo commit message (subject line only)
          APP_COMMIT_MSG=$(git log -1 --pretty=%s)

          cd manifest-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add fluxcd/app-manifests/pos-api-deployment.yaml

          # Only commit when there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit — image tag is already up to date."
          else
            git commit -m "${APP_COMMIT_MSG} (sha-${SHORT_SHA}) [skip ci]"
            git push
          fi